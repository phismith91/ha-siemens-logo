name: Release

# Stables:     v1.2.3           → GitHub Release (kein pre-release)
# Pre-releases: v1.2.3-beta.1   → GitHub Release (prerelease: true)
#               v1.2.3-rc.1
#               v1.2.3-alpha.1

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Type check
        run: mypy custom_components/siemens_logo
      - name: Tests
        run: pytest
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  package-and-release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release type
        id: release_type
        run: |
          TAG="${{ github.ref_name }}"
          if echo "$TAG" | grep -qE -- "-(alpha|beta|rc)\.[0-9]+$"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is a PRE-RELEASE"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is a STABLE release"
          fi

      - name: Validate version consistency
        run: |
          python - << 'PY'
          import json, re, sys
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          # accept v1.2.3 and v1.2.3-beta.1 / -rc.1 / -alpha.1
          if not re.match(r"^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$", tag):
              raise SystemExit(f"Invalid tag format: {tag}")
          tag_version = tag.lstrip("v")

          manifest = json.loads(
              Path("custom_components/siemens_logo/manifest.json").read_text(encoding="utf-8")
          )
          manifest_version = manifest.get("version", "")
          if manifest_version != tag_version:
              raise SystemExit(
                  f"Version mismatch: manifest.json={manifest_version!r}, tag={tag_version!r}\n"
                  "Update manifest.json before tagging."
              )
          print(f"Version consistency OK: {tag_version}")
          PY

      - name: Build zip artifact
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/siemens_logo.zip siemens_logo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/siemens_logo.zip
          generate_release_notes: true
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}

