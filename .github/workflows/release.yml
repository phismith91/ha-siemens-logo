name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Type check
        run: mypy custom_components/siemens_logo
      - name: Tests
        run: pytest
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  package-and-release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version consistency
        run: |
          python - << 'PY'
          import json
          import re
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          if not re.match(r"^v\d+\.\d+\.\d+$", tag):
              raise SystemExit(f"Invalid tag format: {tag}")
          tag_version = tag[1:]

          manifest = json.loads(Path("custom_components/siemens_logo/manifest.json").read_text(encoding="utf-8"))
          manifest_version = manifest.get("version")
          if manifest_version != tag_version:
              raise SystemExit(
                  f"Version mismatch: manifest={manifest_version}, tag={tag_version}"
              )

          print("Version consistency check passed")
          PY
      - name: Create zip artifact
        run: |
          mkdir dist
          cd custom_components
          zip -r ../dist/siemens_logo.zip siemens_logo
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/siemens_logo.zip
          generate_release_notes: true

